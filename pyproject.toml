[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-x"
version = "0.3.0"
description = "Model evolution and concept drift experiments for continual intrusion detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "xgboost>=2.0",
  "scipy>=1.11", "river>=0.21", "joblib>=1.3", "matplotlib>=3.7", "seaborn>=0.12", "psutil>=5.9",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.3"]
dev = ["pytest>=7.4", "build>=1.2"]

[project.scripts]
evox = "evox.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evox*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: requires a running Kafka broker on localhost:9092"]
